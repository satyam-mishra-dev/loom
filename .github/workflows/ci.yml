name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint && npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: integration tests
        run: npm run test:integration
